name: CodeQL

# GitHub's static analysis for JavaScript and TypeScript: findings appear under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Generated docs output and test media are not the library.
          config: |
            paths-ignore:
              - docs/.vitepress/dist
              - "**/test/**"
      - uses: github/codeql-action/analyze@v4
