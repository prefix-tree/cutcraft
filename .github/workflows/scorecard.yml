name: Scorecard

# OpenSSF Scorecard: how the repository is run (branch protection, pinned actions, reviews, a security policy), as a
# score and a badge. Findings appear under Security → Code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
