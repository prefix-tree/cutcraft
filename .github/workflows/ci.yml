name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Benchmarks run only on request: Actions → CI → Run workflow, or `gh workflow run ci.yml`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The oldest Node the packages support and the current LTS.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The render tests generate their test media with ffmpeg; the export tests run in the e2e job.
      # The package mirrors can stall for an hour: each try is cut off after a few minutes, and there are three.
      - name: Install ffmpeg
        timeout-minutes: 24
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update && sudo timeout 300 apt-get install -y ffmpeg; then exit 0; fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test:coverage
      - name: Coverage summary
        if: matrix.node == 22
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: coverage
          path: "**/coverage/"
          if-no-files-found: ignore
      # What gets published: each package's dist, built the way `pnpm publish` builds it, then checked as a tarball.
      - run: pnpm build
      - run: pnpm check:packages

  changeset:
    # A pull request that changes a published package says how in a changeset (.changeset/README.md). The version pull
    # request (`pnpm changeset version`, branch chore/version-packages) consumes them, so it has none by design.
    if: github.event_name == 'pull_request' && github.head_ref != 'chore/version-packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/${{ github.base_ref }}

  e2e:
    # Pinned: Playwright 1.56 cannot install Chromium's system dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package mirrors can stall for an hour: each try is cut off after a few minutes, and there are three.
      - name: Install ffmpeg
        timeout-minutes: 24
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update && sudo timeout 300 apt-get install -y ffmpeg; then exit 0; fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @cutcraft/player exec playwright install --with-deps chromium
      - run: pnpm --filter @cutcraft/player test:e2e
      # The export needs drawElementImage (Chrome 153+); Playwright's pinned Chromium (141) predates it. The export
      # downloads the Chrome for Testing it is tested against, as on a user's machine, once per CHROME_MILESTONE: the
      # key follows chrome.ts, and `browser install` keeps a cached Chrome without asking the network.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/cutcraft/browsers
          key: cutcraft-chrome-${{ runner.os }}-${{ hashFiles('packages/render/src/web/chrome.ts') }}
      - run: pnpm --filter @cutcraft/render exec tsx src/cli.ts browser install
      # The export: video, sound, stills, smart copy, the layout check, the CLI and the recipes.
      - run: pnpm --filter @cutcraft/render test:browser
      # Free code on the video's clock: three.js, Motion and CSS animations in the real Player.
      - run: pnpm --filter @cutcraft/graphics test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/player/playwright-report
          if-no-files-found: ignore
      # Stills that drifted from their golden (packages/render/test/goldens), to compare or adopt.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: goldens-actual
          path: packages/render/test/.tmp/goldens-actual
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:test
      - run: pnpm docs:check
      - run: pnpm docs:build

  # Not a gate: records how fast the export is on a CI machine, for comparison over time.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package mirrors can stall for an hour: each try is cut off after a few minutes, and there are three.
      - name: Install ffmpeg
        timeout-minutes: 24
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update && sudo timeout 300 apt-get install -y ffmpeg; then exit 0; fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1
      # The same Chrome as the e2e job, from the same cache.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/cutcraft/browsers
          key: cutcraft-chrome-${{ runner.os }}-${{ hashFiles('packages/render/src/web/chrome.ts') }}
      - run: pnpm --filter @cutcraft/render exec tsx src/cli.ts browser install
      - run: pnpm --filter @cutcraft/render bench --json bench-results.json | tee bench.md
      - run: pnpm --filter @cutcraft/render bench --tabs 4 --json bench-results-4.json | tee -a bench.md
      - uses: actions/upload-artifact@v4
        with:
          name: render-bench
          path: |
            packages/render/bench-results.json
            packages/render/bench-results-4.json
            bench.md
