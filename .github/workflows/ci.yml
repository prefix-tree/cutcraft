name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Benchmarks run only on request: Actions → CI → Run workflow, or `gh workflow run ci.yml`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The oldest Node the packages support and the current LTS.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The render tests generate their test media with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test:coverage
      - name: Coverage summary
        if: matrix.node == 22
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: coverage
          path: "**/coverage/"
          if-no-files-found: ignore
      # What gets published: each package's dist, built the way `pnpm publish` builds it, then checked as a tarball.
      - run: pnpm build
      - run: pnpm check:packages

  changeset:
    # A pull request that changes a published package says how in a changeset (.changeset/README.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/${{ github.base_ref }}

  e2e:
    # Pinned: Playwright 1.56 cannot install Chromium's system dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @cutcraft/player exec playwright install --with-deps chromium
      - run: pnpm --filter @cutcraft/player test:e2e
      # The browser export needs drawElementImage (Chrome 153+); Playwright's pinned Chromium (141) predates it.
      # Pinned, not "stable": HTML-in-Canvas is still experimental and its opt-in has changed between versions, so a
      # new Chrome is taken on in a pull request of its own, not by a CI run that starts failing.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 157
      - run: '"${{ steps.chrome.outputs.chrome-path }}" --version'
      # The export is checked against the browser here: overlay layout, the audio mix, and the browser engine.
      - run: pnpm --filter @cutcraft/render test:browser
        env:
          CUTCRAFT_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      # Free code on the video's clock: three.js, Motion and CSS animations in the real Player.
      - run: pnpm --filter @cutcraft/graphics test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/player/playwright-report
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:gen
      - run: git diff --exit-code -- docs
      - run: pnpm docs:build

  # Not a gate: records how fast the export is on a CI machine, for comparison over time.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm --filter @cutcraft/render bench --json bench-results.json | tee bench.md
      # The comparison's scenarios (cuts, crossfades, graphics) as H.264, with a worker sweep and a stage breakdown:
      # the before and after of every export performance change, on this runner.
      - run: pnpm --filter @cutcraft/render bench:scenarios --json scenarios-results.json | tee -a bench.md
      # The same on one thread with x264's medium preset (--speed quality), against the default's veryfast.
      - run: pnpm --filter @cutcraft/render bench:scenarios --workers 1 --speed quality --json scenarios-quality.json | tee -a bench.md
      - uses: actions/upload-artifact@v4
        with:
          name: render-bench
          path: |
            packages/render/bench-results.json
            packages/render/scenarios-results.json
            packages/render/scenarios-quality.json
            bench.md
