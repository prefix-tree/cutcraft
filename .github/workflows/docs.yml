name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bench:
        description: Measure the landing page's benchmark again (otherwise the committed docs/bench.json is used)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The landing page's benchmark, the kit's editor loop, measured on this runner when asked (Run workflow, "bench").
      - run: pnpm docs:bench
        if: inputs.bench
      - run: pnpm docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
