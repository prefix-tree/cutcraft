name: Release

# On main, changesets keeps a "Version packages" pull request open with the next versions and changelogs. Merging it
# runs this again with no changesets left, and `pnpm release` publishes. npm trusted publishing: GitHub's OIDC token
# stands in for an npm token, so there is no secret to leak, and npm attaches provenance to each version.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `changeset publish` runs `pnpm publish` for each package not yet on npm: pnpm (10.13+) does the OIDC exchange,
      # builds the package (prepack) and swaps workspace:* for versions; then it tags the release.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
