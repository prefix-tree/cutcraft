name: Release

# Publishes a release when its tag is pushed. After the "chore: version packages" pull request (`pnpm changeset
# version`) has merged into main:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# All packages share one version, so one tag names the release; it must match that version and point at a commit on
# main.
#
# npm trusted publishing: each package on npm trusts this workflow file (release.yml in prefix-tree/cutcraft), so
# GitHub's OIDC token stands in for an npm token. There is no secret to leak, and npm attaches provenance when a
# maintainer approves the staged version. Renaming this file breaks publishing until the packages' trusted publisher
# settings are updated too. Leave "npm publish" unchecked on those publishers; this workflow only runs
# `npm stage publish`.
#
# It can also be run by hand from main (Actions → Release → Run workflow), to retry a release whose tag is already
# pushed: it then stages the version main holds. A version that is staged and not yet approved cannot be staged
# again, and the OIDC token cannot list or reject it. Approve it, or reject it from npmjs.com, before retrying.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No `registry-url`: it writes an .npmrc whose `_authToken=${NODE_AUTH_TOKEN}` is empty here, and npm then sends
      # that instead of doing the OIDC exchange (the registry answers 404).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `npm stage publish` needs npm 11.15.0 or newer. The OIDC exchange itself exists from 11.5.1.
      - run: npm install -g npm@^11.15.0 && npm --version
      - name: Check the tag against main and the packages' version
        run: |
          version=$(node -p "require('./packages/kit/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::run it from main, not $GITHUB_REF_NAME."
              exit 1
            fi
            tag="v$version"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the packages' version $version; tag v$version instead."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag points at a commit that is not on main."
            exit 1
          fi
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "::error::$pending changeset(s) are pending: run \`pnpm changeset version\` and merge the version pull request before tagging."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:packages
      # Packs each package whose version is not on npm (swapping workspace:* for versions) and runs
      # `npm stage publish` on the tarball. The version stays un-installable until a maintainer approves it
      # with 2FA. The pushed tag names the release, so this makes no git tags of its own.
      - run: pnpm release
