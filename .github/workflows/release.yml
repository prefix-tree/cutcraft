name: Release

# Publishes every package to npm when a v* tag is pushed. npm trusted publishing: GitHub's OIDC token stands in
# for an npm token, so there is no secret to leak, and npm attaches provenance to each version.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm (10.13+) does the OIDC exchange itself, builds each package (prepack), swaps workspace:* for versions,
      # and skips versions already on npm. A tag checkout is a detached HEAD, hence --no-git-checks.
      - run: pnpm -r publish --access public --no-git-checks
